[package]
name    = "replay-compat"
version.workspace = true
edition.workspace = true

# ── feature flags ─────────────────────────────────────────────────────────────
# Enable only the client libraries your service actually uses.
[features]
default      = ["http", "redis", "tokio-compat"]
http         = []
redis        = []
sql          = ["dep:sqlx"]
diesel       = ["dep:diesel", "dep:diesel-async"]
bb8-diesel   = ["diesel", "dep:async-bb8-diesel", "dep:bb8"]
tokio-compat = []

[dependencies]
replay-core         = { path = "../replay-core" }
replay-interceptors = { path = "../replay-interceptors" }

serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
uuid        = { version = "1", features = ["v4", "serde"] }
tokio       = { version = "1", features = ["full"] }
thiserror   = "1"
async-trait = "0.1"

# HTTP
reqwest             = { version = "0.11", features = ["json"] }
reqwest-middleware  = "0.2"

# Redis
redis = { version = "0.23", features = ["tokio-comp"] }

# SQL — optional, enabled by the "sql" feature
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-native-tls", "uuid", "chrono", "json"], optional = true }

# Diesel — optional, enabled by the "diesel" feature
diesel       = { version = "2.2.10", features = ["postgres", "serde_json", "uuid", "chrono"], optional = true }
diesel-async = { version = "0.5",    features = ["postgres", "deadpool"], optional = true }

# bb8 pool — optional, enabled by the "bb8-diesel" feature
async-bb8-diesel = { version = "0.2", optional = true }
bb8              = { version = "0.8", optional = true }

[dev-dependencies]
replay-store = { path = "../replay-store" }
wiremock     = "0.5"
